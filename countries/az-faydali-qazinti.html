<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><title>Azərbaycanın faydalı qazıntı yataqları</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fa;--fg:#14203a;--mu:#5d6b86;--bd:#d5dbe6;--mp:#e3e8f0;--hv:#cdd6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1226;--fg:#e8ecf7;--mu:#94a0bd;--bd:#27304d;--mp:#1b2340;--hv:#2c375c}}
:root[data-theme=dark]{--bg:#0d1226;--fg:#e8ecf7;--mu:#94a0bd;--bd:#27304d;--mp:#1b2340;--hv:#2c375c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 4px}p{margin:0;color:var(--mu)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
#chips button{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px}
#chips button.on{border-color:var(--fg);font-weight:600}#chips i{width:10px;height:10px;border-radius:50%;display:block}
svg{width:100%;aspect-ratio:1160/782;display:block}
path{fill:var(--mp);stroke:var(--bg);stroke-width:.8;stroke-linejoin:round;cursor:pointer}path.has{fill:var(--hv)}path.on{stroke:var(--fg);stroke-width:2}
circle{stroke:#fff;stroke-width:1;pointer-events:none}circle.sea{pointer-events:auto;cursor:pointer}
text.lb{font-size:11px;fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}text.sea-t{font-size:12px;font-style:italic;fill:var(--mu);pointer-events:none}
#info{min-height:60px;margin:8px 0}#info ul{list-style:none;margin:6px 0 0;padding:0}#info li{padding:4px 0;border-top:1px solid var(--bd);font-size:14px}#info small{color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.note{margin-top:12px;font-size:12px}
</style></head><body><main>

const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map'),chips=document.getElementById('chips'),info=document.getElementById('info');
const names=[...new Set(Object.values(GR).map(g=>g[0]))],colOf=n=>Object.values(GR).find(g=>g[0]===n)[1];

const byId={};P.forEach(p=>byId[p.i]=p);
let flt='';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const paths=P.map(p=>{const e=el('path',{d:p.d});e.dataset.i=p.i;svg.appendChild(e);return e});
const dots=el('g',{});svg.appendChild(dots);
const list=()=>D.filter(d=>!flt||gname(d[2])===flt);
function render(){
  chips.innerHTML='';
  [['','Hamısı']].concat(names.map(n=>[n,n])).forEach(([k,n])=>{const c=D.filter(d=>!k||gname(d[2])===k).length;

  paths.forEach(e=>{e.classList.remove('on');e.classList.toggle('has',!!g[e.dataset.i])});
  for(const i in g){const c=byId[i].c;if(!c)continue;const a=g[i],n=a.length,r=n==1?0:Math.max(6,n*1.6);

<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoAtlas — Avropa Quiz</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--land:#dfe4ea;--line:#fff;--ac:#2563eb;--ok:#16a34a;--no:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#8b97a7;--land:#2c3642;--line:#12161c;--ac:#60a5fa;--ok:#22c55e;--no:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0 0 12px}h1 span{color:var(--ac)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--land);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.q{font-size:20px;font-weight:600;margin:6px 0 10px;min-height:28px}
.card{background:var(--card);border-radius:14px;padding:10px}
svg{width:100%;height:auto;display:block}svg path{fill:var(--land);stroke:var(--line);stroke-width:.6;transition:fill .2s}
.click svg path{cursor:pointer}.click svg path:hover{fill:var(--ac);opacity:.6}
svg path.t{fill:var(--ac)}svg path.ok{fill:var(--ok)!important}svg path.no{fill:var(--no)!important}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.opts button{padding:14px}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts button.no{background:var(--no);color:#fff;border-color:var(--no)}
.res{text-align:center;padding:24px}.res b{font-size:40px;color:var(--ac)}.res ul{text-align:left;max-width:360px;margin:12px auto;color:var(--mut)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}

<script>
const D={"AL": ["Albaniya", "Tirana"], "AD": ["Andorra", "Andorra la Vella"], "AM": ["Ermənistan", "İrəvan"], "AT": ["Avstriya", "Vyana"], "BE": ["Belçika", "Brüssel"], "BG": ["Bolqarıstan", "Sofiya"], "BA": ["Bosniya və Herseqovina", "Saraybosna"], "BY": ["Belarus", "Minsk"], "CH": ["İsveçrə", "Bern"], "CZ": ["Çexiya", "Praqa"], "DE": ["Almaniya", "Berlin"], "DK": ["Danimarka", "Kopenhagen"], "EE": ["Estoniya", "Tallin"], "FI": ["Finlandiya", "Helsinki"], "GB": ["Böyük Britaniya", "London"], "GE": ["Gürcüstan", "Tbilisi"], "GR": ["Yunanıstan", "Afina"], "HR": ["Xorvatiya", "Zaqreb"], "HU": ["Macarıstan", "Budapeşt"], "IE": ["İrlandiya", "Dublin"], "IS": ["İslandiya", "Reykyavik"], "IT": ["İtaliya", "Roma"], "LI": ["Lixtenşteyn", "Vaduz"], "LT": ["Litva", "Vilnüs"], "LU": ["Lüksemburq", "Lüksemburq"], "LV": ["Latviya", "Riqa"], "MD": ["Moldova", "Kişinyov"], "MK": ["Şimali Makedoniya", "Skopye"], "ME": ["Monteneqro", "Podqoritsa"], "NO": ["Norveç", "Oslo"], "PL": ["Polşa", "Varşava"], "PT": ["Portuqaliya", "Lissabon"], "RO": ["Rumıniya", "Buxarest"], "RS": ["Serbiya", "Belqrad"], "SK": ["Slovakiya", "Bratislava"], "SI": ["Sloveniya", "Lyublyana"], "SE": ["İsveç", "Stokholm"], "TR": ["Türkiyə", "Ankara"], "UA": ["Ukrayna", "Kiyev"], "XK": ["Kosovo", "Priştina"], "NL": ["Niderland", "Amsterdam"], "ES": ["İspaniya", "Madrid"], "FR": ["Fransa", "Paris"], "CY": ["Kipr", "Nikosiya"]},N=10,SKIP=['AD','LI','LU'];
const M={click:'Xəritədə tap',name:'Ölkəni tanı',cap:'Paytaxt'};
let mode='click',list,i,score,wrong,lock;
const $=id=>document.getElementById(id),P=id=>[...document.querySelectorAll('path[data-id="'+id+'"]')];
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
$('tabs').innerHTML=Object.keys(M).map(k=>`<button data-m="${k}">${M[k]}</button>`).join('');
$('tabs').onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;start()}};
function clr(){document.querySelectorAll('path').forEach(p=>p.removeAttribute('class'))}
function start(){let ids=Object.keys(D);if(mode=='click')ids=ids.filter(x=>!SKIP.includes(x));list=sh(ids).slice(0,N);i=0;score=0;wrong=[];
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
 $('mc').classList.toggle('click',mode=='click');$('rs').innerHTML='';next()}
function next(){clr();lock=false;$('op').innerHTML='';if(i>=N)return end();
 const id=list[i];$('pr').textContent=`Sual ${i+1}/${N}`;$('sc').textContent=`Xal: ${score}`;
 if(mode=='click')$('q').textContent='Haradadır: '+D[id][0]+'?';
 else{P(id).forEach(p=>p.classList.add('t'));$('q').textContent=mode=='name'?'Bu hansı ölkədir?':'Bu ölkənin paytaxtı hansıdır?';
  const k=mode=='name'?0:1;const o=sh([id,...sh(Object.keys(D).filter(x=>x!=id)).slice(0,3)]);
  $('op').innerHTML=o.map(x=>`<button data-id="${x}">${D[x][k]}</button>`).join('')}}
function answer(ok,id,btn){if(lock)return;lock=true;if(ok)score++;else wrong.push(id);
 P(id).forEach(p=>{p.classList.remove('t');p.classList.add(ok?'ok':'no')});
 if(btn){btn.classList.add(ok?'ok':'no');const c=document.querySelector(`#op button[data-id="${id}"]`);if(c)c.classList.add('ok')}
 $('sc').textContent=`Xal: ${score}`;setTimeout(()=>{i++;next()},ok?700:1400)}
$('mc').onclick=e=>{if(mode!='click'||lock||e.target.tagName!='path')return;const g=e.target.dataset.id,t=list[i];
 if(g==t)answer(true,t);else{P(g).forEach(p=>p.classList.add('no'));answer(false,t)}}
$('op').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;const t=list[i];
 if(b.dataset.id==t)answer(true,t,b);else{lock=true;wrong.push(t);b.classList.add('no');
  P(t).forEach(p=>{p.classList.remove('t');p.classList.add('ok')});const c=document.querySelector(`#op button[data-id="${t}"]`);c.classList.add('ok');setTimeout(()=>{i++;next()},1400)}}
function end(){clr();$('q').textContent='';$('pr').textContent='';$('sc').textContent='';
 const k=mode=='cap'?1:0;$('rs').innerHTML=`<div class="card res"><b>${score}/${N}</b><p>${score>=9?'Əla! Əsl coğrafiyaçısan 🌍':score>=6?'Yaxşıdır, davam et!':'Bir az da məşq lazımdır'}</p>`+
 (wrong.length?`<ul>${wrong.map(x=>`<li>${D[x][0]}${mode=='cap'?' — '+D[x][1]:''}</li>`).join('')}</ul>`:'')+`<button class="pri" onclick="start()">Yenidən oyna</button></div>`}
start();

<script>
const D={"mx": ["Meksika", "Mexiko"], "bz": ["Belize", "Belmopan"], "br": ["Braziliya", "Braziliya"], "do": ["Dominikan Respublikası", "Santo-Dominqo"], "cu": ["Kuba", "Havana"], "ve": ["Venesuela", "Karakas"], "co": ["Kolumbiya", "Bogota"], "gt": ["Qvatemala", "Qvatemala"], "sr": ["Surinam", "Paramaribo"], "pa": ["Panama", "Panama"], "ar": ["Argentina", "Buenos-Ayres"], "cr": ["Kosta-Rika", "San-Xose"], "py": ["Paraqvay", "Asunsyon"], "ht": ["Haiti", "Port-o-Prens"], "ca": ["Kanada", "Ottava"], "sv": ["Salvador", "San-Salvador"], "gy": ["Qayana", "Corctaun"], "uy": ["Uruqvay", "Montevideo"], "hn": ["Honduras", "Tequsiqalpa"], "ni": ["Nikaraqua", "Managua"], "cl": ["Çili", "Santyaqo"], "ec": ["Ekvador", "Kito"], "us": ["ABŞ", "Vaşinqton"], "pe": ["Peru", "Lima"], "bo": ["Boliviya", "Sukre"], "bs": ["Baham adaları", "Nassau"], "jm": ["Yamayka", "Kinqston"], "tt": ["Trinidad və Tobaqo", "Port-of-Spein"]},N=10,SKIP=['bz','sv','bs','jm','tt'];
const M={click:'Xəritədə tap',name:'Ölkəni tanı',cap:'Paytaxt'};
let mode='click',list,i,score,wrong,lock;
const $=id=>document.getElementById(id),P=id=>[...document.querySelectorAll('path[data-id="'+id+'"]')];
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
$('tabs').innerHTML=Object.keys(M).map(k=>`<button data-m="${k}">${M[k]}</button>`).join('');
$('tabs').onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;start()}};
function clr(){document.querySelectorAll('path[data-id]').forEach(p=>p.removeAttribute('class'))}
function start(){let ids=Object.keys(D);if(mode=='click')ids=ids.filter(x=>!SKIP.includes(x));list=sh(ids).slice(0,N);i=0;score=0;wrong=[];
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
 $('mc').classList.toggle('click',mode=='click');$('rs').innerHTML='';next()}
function next(){clr();lock=false;$('op').innerHTML='';if(i>=N)return end();
 const id=list[i];$('pr').textContent=`Sual ${i+1}/${N}`;$('sc').textContent=`Xal: ${score}`;
 if(mode=='click')$('q').textContent='Haradadır: '+D[id][0]+'?';
 else{P(id).forEach(p=>p.classList.add('t'));$('q').textContent=mode=='name'?'Bu hansı ölkədir?':'Bu ölkənin paytaxtı hansıdır?';
  const k=mode=='name'?0:1;const o=sh([id,...sh(Object.keys(D).filter(x=>x!=id)).slice(0,3)]);
  $('op').innerHTML=o.map(x=>`<button data-id="${x}">${D[x][k]}</button>`).join('')}}
function answer(ok,id,btn){if(lock)return;lock=true;if(ok)score++;else wrong.push(id);
 P(id).forEach(p=>{p.classList.remove('t');p.classList.add(ok?'ok':'no')});
 if(btn){btn.classList.add(ok?'ok':'no');const c=document.querySelector(`#op button[data-id="${id}"]`);if(c)c.classList.add('ok')}
 $('sc').textContent=`Xal: ${score}`;setTimeout(()=>{i++;next()},ok?700:1400)}
$('mc').onclick=e=>{if(mode!='click'||lock||!e.target.dataset.id)return;const g=e.target.dataset.id,t=list[i];
 if(g==t)answer(true,t);else{P(g).forEach(p=>p.classList.add('no'));answer(false,t)}}
$('op').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;const t=list[i];
 if(b.dataset.id==t)answer(true,t,b);else{lock=true;wrong.push(t);b.classList.add('no');
  P(t).forEach(p=>{p.classList.remove('t');p.classList.add('ok')});const c=document.querySelector(`#op button[data-id="${t}"]`);c.classList.add('ok');setTimeout(()=>{i++;next()},1400)}}
function end(){clr();$('q').textContent='';$('pr').textContent='';$('sc').textContent='';
 const k=mode=='cap'?1:0;$('rs').innerHTML=`<div class="card res"><b>${score}/${N}</b><p>${score>=9?'Əla! Əsl coğrafiyaçısan 🌍':score>=6?'Yaxşıdır, davam et!':'Bir az da məşq lazımdır'}</p>`+
 (wrong.length?`<ul>${wrong.map(x=>`<li>${D[x][0]}${mode=='cap'?' — '+D[x][1]:''}</li>`).join('')}</ul>`:'')+`<button class="pri" onclick="start()">Yenidən oyna</button></div>`}
start();
